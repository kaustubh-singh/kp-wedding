<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add guests · Kaustubh &amp; Prapti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cinzel:wght@500;600&display=swap">
<style>
:root{
  --paper:#fbf3e4; --card:#fffaf0; --ink:#2d1a20; --muted:#6b5145; --maroon:#6e1424; --marigold:#e0891a;
  --line:#dcc6a0; --ok:#2f6b3a; --okbg:#e6f1e3; --no:#8a3a2a; --nobg:#f6e3dc; --wait:#7a6650; --waitbg:#f1e8d8;
  --script:'Great Vibes',cursive; --serif:'Cormorant Garamond',Georgia,serif; --caps:'Cinzel','Cormorant Garamond',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--script);font-weight:400;color:var(--maroon);font-size:44px;line-height:1.1;margin:0;text-align:center}
.sub{text-align:center;color:var(--muted);font-style:italic;margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label.f{display:block;margin-bottom:16px}
.l{display:block;font-weight:700;font-size:17px;margin-bottom:6px}
.h{font-weight:500;font-style:italic;color:var(--muted);font-size:15px}
input[type=text],input[type=tel]{font:inherit;font-size:18px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff}
.stepper button{font:inherit;font-size:22px;width:44px;height:44px;border:0;background:none;color:var(--maroon);cursor:pointer;border-radius:999px}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:17px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip small{display:block;font-size:13px;opacity:.85;line-height:1.1}
.btn{display:block;width:100%;font-family:var(--caps);letter-spacing:.12em;font-size:16px;font-weight:600;border:0;border-radius:999px;padding:15px 18px;min-height:52px;cursor:pointer;text-align:center;text-decoration:none}
.primary{background:var(--maroon);color:#fff}
.primary:disabled{opacity:.6;cursor:default}
.wa{background:#1f8a4c;color:#fff}
.ghost{background:none;border:1px solid var(--line);color:var(--maroon)}
.stack{display:grid;gap:10px;margin-top:14px}
.err{color:#9b1c1c;font-weight:600;margin:10px 0 0}
.hide{display:none!important}
.done-title{font-family:var(--script);font-size:36px;color:var(--maroon);margin:0;line-height:1.1}
.msgbox{white-space:pre-wrap;font-size:16px;line-height:1.4;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;color:var(--muted);user-select:all}
.stats{display:flex;gap:8px;margin:28px 0 10px;flex-wrap:wrap}
.stat{flex:1 1 0;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:26px;color:var(--maroon);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
h2{font-family:var(--caps);font-size:15px;letter-spacing:.14em;color:var(--maroon);margin:22px 0 8px;font-weight:600}
.list{display:grid;gap:8px}
.g{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.g .n{font-weight:700;font-size:18px}
.g .m{grid-column:1;font-size:15px;color:var(--muted)}
.pill{grid-column:1;justify-self:start;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:4px}
.pill.yes{background:var(--okbg);color:var(--ok)} .pill.no{background:var(--nobg);color:var(--no)} .pill.wait{background:var(--waitbg);color:var(--wait)}
.g a.re{grid-column:2;grid-row:1/span 3;font-size:14px;font-weight:700;color:#1f8a4c;text-decoration:none;border:1px solid #bfe0cb;border-radius:999px;padding:8px 12px;min-height:40px;display:inline-flex;align-items:center}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:12px}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .5s ease both}@keyframes f{from{opacity:.001;transform:translateY(6px)}}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Add a guest</h1>
  <p class="sub">Kaustubh &amp; Prapti · invite list</p>

  <div id="bad" class="card hide" style="text-align:center">This link isn’t valid. Please use your full guest-form link.</div>

  <div id="app" class="hide">
    <form id="form" class="card" novalidate autocomplete="off">
      <label class="f"><span class="l">Name <span class="h">as you’d greet them</span></span>
        <input type="text" id="name" placeholder="e.g. Rohan Mehta or Sharma family" required></label>
      <label class="f"><span class="l">WhatsApp number</span>
        <input type="tel" id="phone" inputmode="tel" placeholder="e.g. 98765 43210"></label>
      <div class="f" style="margin-bottom:16px"><span class="l">How many people? <span class="h">including them</span></span>
        <div class="row"><div class="stepper"><button type="button" id="minus" aria-label="One fewer">−</button><output id="count">2</output><button type="button" id="plus" aria-label="One more">+</button></div></div></div>
      <div class="f" style="margin-bottom:16px"><span class="l">Group <span class="h">sets the tone of the message</span></span>
        <div class="chips" id="groups"></div></div>
      <div class="f" style="margin-bottom:6px"><span class="l">Invite to</span>
        <div class="chips">
          <button type="button" class="chip" data-k="wedding" aria-pressed="true">Wedding<small>Anand · 9–10 Dec</small></button>
          <button type="button" class="chip" data-k="reception" aria-pressed="true">Reception<small>Navi Mumbai · 13 Dec</small></button>
        </div></div>
      <button class="btn primary" id="add" type="submit" style="margin-top:18px">Add &amp; get invite</button>
      <p class="err hide" id="err" role="alert"></p>
    </form>

    <div id="done" class="card fade hide" aria-live="polite"></div>

    <div class="stats" id="stats"></div>
    <h2>Invited so far</h2>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </div>
</main>
<script>
const API = "https://script.google.com/macros/s/AKfycbz2ryPgkQuCHZGXfLdsvS6-JCMXnUkRD-OKaqgxRROi9bWbUqHBw8Q59xq-Cb6C2mb_/exec";
// google.script.run look-alike that calls the Apps Script JSON API without cookies (works in any browser, any number of Google accounts)
window.google = { script: {} };
Object.defineProperty(window.google.script, 'run', { get() {
  let ok = () => {}, bad = () => {};
  const o = { withSuccessHandler(f) { ok = f; return o; }, withFailureHandler(f) { bad = f; return o; } };
  return new Proxy(o, { get(t, k) { if (k in t) return t[k]; return (...args) =>
    fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify({ fn: k, args }) })
      .then(r => r.json()).then(j => j.ok ? ok(j.result) : bad(new Error(j.error))).catch(e => bad(e)); } });
} });
function icsData(x, P) {
  const p = P[x.place], c = x.cal, esc = s => String(s).replace(/([,;\\])/g, '\\$1');
  const when = c.allDay ? ['DTSTART;VALUE=DATE:' + c.allDay[0], 'DTEND;VALUE=DATE:' + c.allDay[1]] : ['DTSTART:' + c.start, 'DTEND:' + c.end];
  const t = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KP//Wedding//EN','BEGIN:VEVENT','UID:' + x.key + '-kp-2026@invite','DTSTAMP:20261021T000000Z']
    .concat(when, ['SUMMARY:' + esc(c.title), 'DESCRIPTION:' + esc(c.details), 'LOCATION:' + esc(p.name + ', ' + p.line), 'END:VEVENT', 'END:VCALENDAR']).join('\r\n');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(t);
}
</script>
<script>
const OK = location.hash.length > 1;
const KEY = decodeURIComponent(location.hash.slice(1));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let count = 2; const ev = {wedding:true, reception:true}; let group = '';
const GROUPS = ["College", "ICICI", "Work friends", "Office"];

function syncForm(){
  $('#count').textContent = count; $('#minus').disabled = count <= 1; $('#plus').disabled = count >= 20;
  document.querySelectorAll('.chip[data-k]').forEach(b => b.setAttribute('aria-pressed', String(!!ev[b.dataset.k])));
  document.querySelectorAll('.chip[data-g]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === group)));
}

function copy(text, btn){
  const done = () => { const t = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = t, 1600); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

function showDone(r){
  const d = $('#done');
  d.innerHTML = `<p class="done-title">${esc(r.name.split(' ')[0])} is on the list</p>
    <p class="h" style="margin:4px 0 0">Their personal invite link:</p>
    <div class="linkbox">${esc(r.link)}</div>
    <p class="h" style="margin:12px 0 0">Message that will open in WhatsApp (you can edit it there before sending):</p>
    <div class="msgbox">${esc(r.msg)}</div>
    <div class="stack">
      ${r.wa ? `<a class="btn wa" href="${esc(r.wa)}" target="_blank" rel="noopener">Send on WhatsApp</a>` : `<p class="h" style="margin:0">No number added, so copy the message and send it yourself.</p>`}
      <button type="button" class="btn ghost" id="cpMsg">Copy invite message</button>
      <button type="button" class="btn ghost" id="again">Add another guest</button>
    </div>`;
  $('#cpMsg').onclick = e => copy(r.msg, e.currentTarget);
  $('#again').onclick = () => { d.classList.add('hide'); $('#form').classList.remove('hide'); $('#name').focus(); };
  $('#form').classList.add('hide'); d.classList.remove('hide'); d.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderList(rows){
  const yes = rows.filter(r => r.state === 'yes'), replied = rows.filter(r => r.state !== 'wait');
  const people = yes.reduce((a, r) => a + (Number(r.people) || 0), 0);
  $('#stats').innerHTML = [[rows.length, 'invited'], [replied.length, 'replied'], [people, 'people coming']]
    .map(s => `<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
  $('#list').innerHTML = rows.length ? rows.map(r => `<div class="g">
      <span class="n">${esc(r.name)}</span>
      <span class="m">${esc(r.group)} · ${esc(r.invited)}</span>
      <span class="pill ${r.state}">${esc(r.status)}</span>
      ${r.wa ? `<a class="re" href="${esc(r.wa)}" target="_blank" rel="noopener" aria-label="Send ${esc(r.name)} their invite on WhatsApp">WhatsApp</a>` : ''}
    </div>`).join('') : '<div class="empty">No one yet. Add your first guest above.</div>';
}

function load(){ google.script.run.withSuccessHandler(renderList).withFailureHandler(e => { if (/Not allowed/.test(e && e.message)) { $('#app').classList.add('hide'); $('#bad').classList.remove('hide'); return; } $('#list').innerHTML = '<div class="empty">Couldn’t load the list. Pull to refresh.</div>'; }).listGuests(KEY); }

if (!OK) { $('#bad').classList.remove('hide'); }
else {
  $('#app').classList.remove('hide');
  $('#minus').onclick = () => { count = Math.max(1, count - 1); syncForm(); };
  $('#plus').onclick = () => { count = Math.min(20, count + 1); syncForm(); };
  $('#groups').innerHTML = GROUPS.map(g => `<button type="button" class="chip" data-g="${esc(g)}" aria-pressed="false">${esc(g)}</button>`).join('');
  document.querySelectorAll('.chip[data-g]').forEach(b => b.onclick = () => { group = b.dataset.g; if (group === 'Office') { ev.wedding = false; ev.reception = true; } syncForm(); });
  document.querySelectorAll('.chip[data-k]').forEach(b => b.onclick = () => { ev[b.dataset.k] = !ev[b.dataset.k]; syncForm(); });
  $('#form').addEventListener('submit', e => {
    e.preventDefault(); const err = $('#err');
    const name = $('#name').value.trim();
    if (!name) { err.textContent = 'Please enter a name.'; err.classList.remove('hide'); $('#name').focus(); return; }
    if (!group) { err.textContent = 'Pick a group, so the message sounds right.'; err.classList.remove('hide'); return; }
    if (!ev.wedding && !ev.reception) { err.textContent = 'Tick Wedding, Reception or both.'; err.classList.remove('hide'); return; }
    err.classList.add('hide');
    const btn = $('#add'); btn.disabled = true; btn.textContent = 'Adding…';
    google.script.run
      .withSuccessHandler(r => { btn.disabled = false; btn.textContent = 'Add & get invite';
        $('#name').value = ''; $('#phone').value = ''; count = 2; ev.wedding = ev.reception = true; group = ''; syncForm(); showDone(r); load(); })
      .withFailureHandler(x => { btn.disabled = false; btn.textContent = 'Add & get invite';
        err.textContent = (x && x.message) || 'That didn’t go through. Check your connection and try again.'; err.classList.remove('hide'); })
      .addGuest(KEY, { name, phone: $('#phone').value.trim(), max: count, events: ev, group });
  });
  syncForm(); load();
}
</script>
</body>
</html>
